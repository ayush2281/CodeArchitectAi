<svg viewBox="0 0 1800 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151c26" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1800" height="720" fill="#0a0e14"/>
  <rect x="0" y="0" width="1800" height="720" fill="url(#grid)"/>

  <!-- Header -->
  <text x="900" y="52" text-anchor="middle" fill="#e6edf3" font-size="34" font-weight="700" letter-spacing="0.5">CodeArchitect AI</text>
  <text x="900" y="82" text-anchor="middle" fill="#8b949e" font-size="16" font-weight="400">AI-Powered Codebase Architecture &amp; Change-Impact Analysis Agent</text>

  <!-- Static Code Analysis group -->
  <rect x="220" y="175" width="1160" height="175" rx="18" fill="#ffffff05" stroke="#2b3542" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="800" y="200" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="2">STATIC CODE ANALYSIS</text>

  <!-- Tags -->
  <text x="117.5" y="220" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="1.5">INPUT</text>
  <text x="1482.5" y="220" text-anchor="middle" fill="#a371f7" font-size="11" font-weight="700" letter-spacing="1.5">AI STAGE</text>
  <text x="1677.5" y="220" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="1.5">OUTPUT</text>

  <!-- Boxes -->
  <!-- 1 Repository Input -->
  <rect x="40" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#3fb950" stroke-width="1.8" filter="url(#soft-shadow)"/>
  <text x="117.5" y="276" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">
    <tspan x="117.5" dy="0">Repository</tspan>
    <tspan x="117.5" dy="20">Input</tspan>
  </text>

  <!-- 2 Repository Scanner -->
  <rect x="235" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#30363d" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="312.5" y="266" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">
    <tspan x="312.5" dy="0">Repository</tspan>
    <tspan x="312.5" dy="20">Scanner</tspan>
  </text>

  <!-- 3 AST Parser -->
  <rect x="430" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#30363d" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="507.5" y="276" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">AST Parser</text>

  <!-- 4 Dependency Graph -->
  <rect x="625" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#30363d" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="702.5" y="266" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">
    <tspan x="702.5" dy="0">Dependency</tspan>
    <tspan x="702.5" dy="20">Graph</tspan>
  </text>

  <!-- 5 Call Graph -->
  <rect x="820" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#30363d" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="897.5" y="276" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Call Graph</text>

  <!-- 6 Architecture Analysis -->
  <rect x="1015" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#58a6ff" stroke-width="1.6" filter="url(#soft-shadow)"/>
  <text x="1092.5" y="266" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">
    <tspan x="1092.5" dy="0">Architecture</tspan>
    <tspan x="1092.5" dy="20">Analysis</tspan>
  </text>

  <!-- 7 Change Impact Analysis -->
  <rect x="1210" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#58a6ff" stroke-width="1.6" filter="url(#soft-shadow)"/>
  <text x="1287.5" y="266" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">
    <tspan x="1287.5" dy="0">Change Impact</tspan>
    <tspan x="1287.5" dy="20">Analysis</tspan>
  </text>

  <!-- 8 Qwen AI -->
  <rect x="1405" y="230" width="155" height="80" rx="14" fill="#161222" stroke="#a371f7" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1482.5" y="276" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700">Qwen AI</text>

  <!-- 9 Architecture Report -->
  <rect x="1600" y="230" width="155" height="80" rx="14" fill="#131a23" stroke="#3fb950" stroke-width="1.8" filter="url(#soft-shadow)"/>
  <text x="1677.5" y="266" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">
    <tspan x="1677.5" dy="0">Architecture</tspan>
    <tspan x="1677.5" dy="20">Report</tspan>
  </text>

  <!-- Arrows between boxes -->
  <line x1="195" y1="270" x2="231" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="270" x2="426" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="585" y1="270" x2="621" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="270" x2="816" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="975" y1="270" x2="1011" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1170" y1="270" x2="1206" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1365" y1="270" x2="1401" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1560" y1="270" x2="1596" y2="270" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <text x="900" y="382" text-anchor="middle" fill="#8b949e" font-size="13" font-style="italic">
    Structured static-analysis results are passed as input to <tspan fill="#a371f7" font-style="normal" font-weight="600">Qwen AI</tspan>, which synthesizes them into the final Architecture Report.
  </text>

  <!-- Connector dashed lines to detail panel -->
  <line x1="1092.5" y1="310" x2="1057" y2="420" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1287.5" y1="310" x2="1272" y2="420" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Detail panel -->
  <rect x="950" y="420" width="430" height="190" rx="16" fill="#101620" stroke="#2b3542" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1165" y="446" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" letter-spacing="1">EXTRACTED ANALYSIS SIGNALS</text>

  <line x1="1165" y1="460" x2="1165" y2="595" stroke="#2b3542" stroke-width="1"/>

  <!-- Column 1: Architecture Analysis -->
  <text x="970" y="470" fill="#58a6ff" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE ANALYSIS</text>
  <text x="970" y="492" fill="#c9d1d9" font-size="14">• Fan-in / Fan-out</text>
  <text x="970" y="514" fill="#c9d1d9" font-size="14">• Coupling</text>
  <text x="970" y="536" fill="#c9d1d9" font-size="14">• Circular Dependencies</text>
  <text x="970" y="558" fill="#c9d1d9" font-size="14">• Dead / Unreferenced Code</text>
  <text x="970" y="580" fill="#c9d1d9" font-size="14">• Architecture Issues</text>

  <!-- Column 2: Change Impact Analysis -->
  <text x="1185" y="470" fill="#58a6ff" font-size="11" font-weight="700" letter-spacing="1">CHANGE IMPACT ANALYSIS</text>
  <text x="1185" y="492" fill="#c9d1d9" font-size="14">• Direct &amp; Indirect Change Impact</text>
  <text x="1185" y="514" fill="#c9d1d9" font-size="14">• Function Call Relationships</text>

</svg>
